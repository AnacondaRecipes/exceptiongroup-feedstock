{% set name = "exceptiongroup" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8b412432c6055b0b7d14c310000ae93352ed6754f70fa8f7c34141f91c4e3219

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<37]

requirements:
  host:
    - python
    - pip
    - flit-scm
  run:
    - python
    - typing-extensions >=4.6.0  # [py<313]

{% set skip_tests = "" %}
# the package shims standard library BaseExceptionGroup from python 3.11 and up. this test relies on
# an older standard library behavior that was changed in 3.13. the standard lib fix which is causing
# issues in this test: https://github.com/python/cpython/issues/141732
{% set skip_tests = skip_tests + " --deselect=tests/test_exceptions.py::test_exceptions_mutate_original_sequence" %}  # [py>=313]

test:
  source_files:
    - tests
  imports:
    - exceptiongroup
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ skip_tests }} tests
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/exceptiongroup
  summary: Backport of PEP 654 (exception groups)
  description: |
    "This is a backport of the BaseExceptionGroup and ExceptionGroup classes from Python 3.11.
    It contains the following:
      * The exceptiongroup.BaseExceptionGroup and exceptiongroup.ExceptionGroup classes
      * A utility function (exceptiongroup.catch()) for catching exceptions possibly nested in an exception group
      * Patches to the TracebackException class that properly formats exception groups (installed on import)
      * An exception hook that handles formatting of exception groups through TracebackException (installed on import)
      * Special versions of some of the functions from the traceback module"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/agronholm/exceptiongroup
  doc_url: https://docs.python.org/3/library/exceptions.html

extra:
  recipe-maintainers:
    - xylar
